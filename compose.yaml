services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ps1
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: ps1
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ps1_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps1 -d ps1"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  ps1_postgres:
