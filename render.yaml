# Legacy server-key example; the selected target is now Vercel Hobby (docs/DEPLOYMENT.md).
# This does not configure the current three-submitter BYOK profile. Do not apply it.
# Applying this old example provisions PAID infrastructure and is not authorized.
services:
  - type: web
    name: ps1-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m scripts.hosted api
    preDeployCommand: python -m scripts.hosted migrate
    healthCheckPath: /api/v1/readyz
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ps1-postgres
          property: connectionString
      - key: APP_API_TOKEN
        generateValue: true
      - key: REVIEWER_API_TOKEN
        generateValue: true
  - type: worker
    name: ps1-worker
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m scripts.hosted worker
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ps1-postgres
          property: connectionString
      - key: APP_API_TOKEN
        fromService:
          type: web
          name: ps1-api
          envVarKey: APP_API_TOKEN
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: PS1_POLICY_VERSION
        value: policy-1.1-demo
      - key: PS1_ENABLE_WORKER
        value: "0"
      - key: PS1_OPENAI_RATES_FILE
        value: /app/rates.json
databases:
  - name: ps1-postgres
    postgresMajorVersion: "17"
    plan: 0.5c-1g
    region: singapore
    diskSizeGB: 10
    ipAllowList: []
